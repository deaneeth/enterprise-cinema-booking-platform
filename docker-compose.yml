# docker-compose.yml (Member 1 creates)
# Docker Compose configuration - Orchestrates all application services
# Defines and configures frontend, backend, database, and other services
# Used to run the entire application stack with a single command

version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cinema-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - cinema-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinema-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/cinema-booking?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cinema-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinema-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cinema-network

volumes:
  mongodb_data:

networks:
  cinema-network:
    driver: bridge